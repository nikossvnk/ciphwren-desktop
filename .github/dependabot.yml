# Opens pull requests to update the dependencies. The workflow (check.yml) checks each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # ESLint and its rules come out together, and a new major version of one needs the other's
      # (one pull request each fails to install), so they're one pull request, majors too. (A
      # package goes to the first group it matches.)
      eslint:
        patterns: ["eslint", "@eslint/js"]
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The Expo SDK decides the versions of these, so they're updated with it, by hand (npx expo
      # install --fix, which picks the set that goes with the SDK): Dependabot would take the
      # newest of each instead. `expo` itself isn't here, so a new SDK opens a pull request: that's
      # the branch to run `npx expo install --fix` on.
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-get-random-values"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-web"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/netinfo"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
